[project]
name = "proxy-aggregator"
version = "0.1.0"
description = "Public proxy configuration aggregator — GitHub Actions, no VPS, stdlib-only"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"

dependencies = []  # stdlib-only by design

[project.scripts]
proxy-aggregator = "proxy_aggregator.aggregate:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
