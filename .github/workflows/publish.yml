name: Publish

on:
  workflow_dispatch:
  schedule:
    # Run daily at 00:00 UTC
    - cron: "0 0 * * *"

permissions:
  contents: write

concurrency:
  group: publish
  cancel-in-progress: false

env:
  # Runtime SQLite database; *.db is gitignored so it is never committed.
  PA_DATABASE_URL: sqlite:///output/proxyaggregator.db
  # Production source definitions live in the repository (version-controlled).
  PA_SOURCES_FILE: config/sources.json
  # GeoIP database location. The GeoLite2-City.mmdb is downloaded fresh into
  # `.runtime/geoip/` (inside the workspace) on every run: it is never
  # committed (git add is scoped to `output` and *.mmdb is gitignored).
  PA_GEOIP_DB_PATH: ${{ github.workspace }}/.runtime/geoip/GeoLite2-City.mmdb

jobs:
  aggregate:
    name: Aggregate & Publish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "0.12"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Create output directory
        run: mkdir -p output

      # GeoIP provisioning (Phase 11). Production never commit the MMDB file.
      # The GeoLite2-City database is downloaded fresh on every run from
      # MaxMind's official download endpoint into $PA_GEOIP_DB_PATH (a
      # .runtime/ dir inside the workspace that is never staged/committed).
      # Credentials come only from GitHub Secrets; nothing is hard-coded or
      # logged. MaxMind limits GeoLite downloads to 30/day; the schedule runs
      # once daily.
      - name: Provision GeoLite2-City database
        shell: bash
        env:
          MAXMIND_ACCOUNT_ID: ${{ secrets.MAXMIND_ACCOUNT_ID }}
          MAXMIND_LICENSE_KEY: ${{ secrets.MAXMIND_LICENSE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$MAXMIND_ACCOUNT_ID" ] || [ -z "$MAXMIND_LICENSE_KEY" ]; then
            echo "ERROR: MAXMIND_ACCOUNT_ID / MAXMIND_LICENSE_KEY repository secrets are not configured." >&2
            exit 1
          fi
          db_path="$PA_GEOIP_DB_PATH"
          mkdir -p "$(dirname "$db_path")"
          archive="$RUNNER_TEMP/geolite2-city.tar.gz"
          curl -fsSL --retry 3 --connect-timeout 30 \
            -u "$MAXMIND_ACCOUNT_ID:$MAXMIND_LICENSE_KEY" \
            -o "$archive" \
            "https://download.maxmind.com/geoip/databases/GeoLite2-City/download?suffix=tar.gz"
          extract="$RUNNER_TEMP/geolite2-city-extract"
          rm -rf "$extract"
          mkdir -p "$extract"
          tar -xzf "$archive" -C "$extract"
          shopt -s nullglob
          candidates=( "$extract"/GeoLite2-City_*/GeoLite2-City.mmdb )
          if [ "${#candidates[@]}" -ne 1 ] || [ ! -f "${candidates[0]}" ]; then
            echo "ERROR: GeoLite2-City.mmdb not found in the downloaded archive." >&2
            exit 1
          fi
          mv "${candidates[0]}" "$db_path"
          echo "GeoIP database provisioned at $db_path"

      # Fails fast with a clear error if the provisioned database is missing,
      # unreadable, invalid, or the wrong type. Never prints credentials.
      - name: Verify GeoIP database
        run: uv run python -m proxyaggregator verify-geoip

      - name: Apply database migrations
        run: uv run alembic upgrade head

      # Production source seeding (Phase 9.2). The `seed-sources` command loads
      # the repository-controlled config/sources.json definition file into the
      # `sources` table (validated, credential-free, url-keyed upsert). It never
      # fetches; the pipeline below owns all network I/O. Seed *before* the
      # pipeline so the empty-table fast-fail reflects the real definitions.
      - name: Seed production sources
        run: uv run python -m proxyaggregator seed-sources

      # Full pipeline integration point (Phase 9.1, roadmap item "Full pipeline
      # integration"). The `pipeline` command orchestrates sources -> parse ->
      # dedup -> persist -> geoip -> health -> score -> subscription in
      # docs/PUBLISHER.md's order and fails fast (non-zero) when no sources are
      # configured or no proxy is eligible, so empty/stale feeds are never
      # published. Production sources are registered in the `sources` table by
      # the seed step above; the pipeline never invents sources.
      - name: Run production pipeline
        run: uv run python -m proxyaggregator pipeline

      - name: Guard against empty output
        run: |
          if [ ! -d output ] || [ -z "$(find output -type f ! -name '*.db' 2>/dev/null)" ]; then
            echo "No subscription artifacts generated; refusing to publish empty feeds." >&2
            exit 1
          fi

      - name: Commit & push generated subscriptions
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output
          if git diff --cached --quiet; then
            echo "No subscription changes to commit."
            exit 0
          fi
          git commit -m "chore: update generated subscriptions"
          git push