name: Publish

on:
  workflow_dispatch:
  # Phase 20: the publish watchdog asks for a run with this event. It is
  # deliberately *not* `workflow_dispatch`: the freshness gate forces
  # Decision RUN only for `workflow_dispatch` (a human asking for an immediate
  # publication), so a watchdog request stays subject to the same 13-minute
  # gate as a scheduled run. A watchdog can therefore add scheduling
  # opportunities without ever bypassing the publication cadence.
  repository_dispatch:
    types: [publish-request]
  schedule:
    # Trigger every 5 minutes (Phase 18): scheduled workflows are best-effort
    # and may be delayed, so a 5-minute trigger gives many opportunities to
    # start. A freshness gate (see .github/actions/publish/action.yml) still
    # caps real publications at ~once per 15 minutes.
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: publish
  cancel-in-progress: false

env:
  # Runtime SQLite database; *.db is gitignored so it is never committed.
  PA_DATABASE_URL: sqlite:///output/proxyaggregator.db
  # Production source definitions live in the repository (version-controlled).
  PA_SOURCES_FILE: config/sources.json
  # GeoIP database location. The country-level MMDB (database_type
  # "country ipvAll", no MaxMind account or secrets needed) is downloaded
  # fresh into `.runtime/geoip/` (inside the workspace) on every run: it is
  # never committed (git add is scoped to `output` + the generated root
  # README country index and *.mmdb is gitignored).
  PA_GEOIP_DB_PATH: ${{ github.workspace }}/.runtime/geoip/user-country.mmdb

# Phase 21. The generation sequence lives in the shared composite action
# .github/actions/publish so a bounded retry can rerun it verbatim on a fresh
# checkout of the newest main. The initial attempt always runs from the commit
# that triggered the workflow; if that commit is no longer origin/main once the
# pipeline has finished, the attempt discards its release and the retry
# regenerates it. There is no rebase, no force push, and no self-dispatch.
jobs:
  attempt-1:
    name: Aggregate & Publish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      decision: ${{ steps.publish.outputs.decision }}
      raced: ${{ steps.publish.outputs.raced }}
      published: ${{ steps.publish.outputs.published }}
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "0.12"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-extras

      # Phase 22: the action always appends a run summary to the job summary
      # from its own step outputs (published / skipped / race-discarded /
      # failed) and hands the freshness decision and publication result back to
      # this job. The triggers, the concurrency group, and the attempt-2 gate
      # are unchanged.
      - name: Generate, verify, and publish subscriptions
        id: publish
        uses: ./.github/actions/publish
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          attempt: "1"

  # Bounded to a single retry. It checks out the current main rather than the
  # commit that triggered the workflow, so the release is built from the newest
  # tree and the freshness gate reads the newest output/published_at.json. If
  # main moves again while this attempt runs, the release is discarded, the job
  # fails, and the next scheduled or watchdog trigger retries from scratch. A
  # failed attempt never advances published_at.json and never publishes output
  # built from a stale tree.
  attempt-2:
    name: Aggregate & Publish (regenerate on latest main)
    needs: attempt-1
    if: needs.attempt-1.outputs.raced == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "0.12"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Generate, verify, and publish subscriptions
        id: publish
        uses: ./.github/actions/publish
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          attempt: "2"

      # The job summary already carries attempt 2's DISCARDED run summary; this
      # final note states the job-level outcome so an exhausted retry can never
      # be read as a successful publication.
      - name: Report exhausted publication attempts
        if: steps.publish.outputs.raced == 'true'
        run: |
          echo "::error::origin/main moved again while the regenerated release was being built. The stale release was discarded, nothing was pushed, and output/published_at.json was not advanced. Both bounded attempts are exhausted; the next scheduled or watchdog trigger will retry from the latest main."
          {
            echo "## Publication — FAILED (attempts exhausted)"
            echo
            echo "Attempt 1 detected a stale tree and was discarded; attempt 2 detected a"
            echo "second stale tree and was also discarded. No release was published,"
            echo "no output was committed, and \`output/published_at.json\` was not advanced."
            echo "The next scheduled or watchdog trigger retries from the latest main."
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1
