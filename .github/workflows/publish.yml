name: Publish

on:
  workflow_dispatch:
  schedule:
    # Run daily at 00:00 UTC
    - cron: "0 0 * * *"

permissions:
  contents: write

concurrency:
  group: publish
  cancel-in-progress: false

env:
  # Runtime SQLite database; *.db is gitignored so it is never committed.
  PA_DATABASE_URL: sqlite:///output/proxyaggregator.db

jobs:
  aggregate:
    name: Aggregate & Publish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "0.12"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Create output directory
        run: mkdir -p output

      - name: Apply database migrations
        run: uv run alembic upgrade head

      # Full pipeline integration point (Phase 9.1, roadmap item "Full pipeline
      # integration"). The `pipeline` command orchestrates sources -> parse ->
      # dedup -> persist -> geoip -> health -> score -> subscription in
      # docs/PUBLISHER.md's order and fails fast (non-zero) when no sources are
      # configured or no proxy is eligible, so empty/stale feeds are never
      # published. Production sources are registered in the `sources` table by
      # `PA_DATABASE_URL`; the pipeline never invents sources.
      - name: Run production pipeline
        run: uv run python -m proxyaggregator pipeline

      - name: Guard against empty output
        run: |
          if [ ! -d output ] || [ -z "$(find output -type f ! -name '*.db' 2>/dev/null)" ]; then
            echo "No subscription artifacts generated; refusing to publish empty feeds." >&2
            exit 1
          fi

      - name: Commit & push generated subscriptions
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output
          if git diff --cached --quiet; then
            echo "No subscription changes to commit."
            exit 0
          fi
          git commit -m "chore: update generated subscriptions"
          git push