# ProxyAggregator — scheduled aggregation pipeline
#
# Runs on GitHub Actions, collects public proxy configs, verifies them,
# and publishes results to the default branch.
# Xray-core binary is pinned and SHA-256 verified before execution.

name: ProxyAggregator

on:
  schedule:
    # Every 15 minutes (GitHub schedule is best-effort)
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Force run (ignore freshness gate)'
        required: false
        default: 'false'
  push:
    branches: [main]
    paths:
      - 'proxy_aggregator/**'
      - '.github/workflows/aggregate.yml'

concurrency:
  group: aggregate
  cancel-in-progress: true

permissions:
  contents: write

env:
  UPDATE_INTERVAL_MINUTES: "15"
  FRESHNESS_GATE_MINUTES: "13"
  PUBLISH_BRANCH: main
  OUT_MARK: "[auto-output]"
  # Xray-core pin — latest stable as of 2026-10-21
  # When updating XRAY_VERSION, independently verify both SHA-256 values:
  #   sha256sum Xray-linux-64.zip     (zip artifact hash)
  #   sha256sum .cache/xray           (extracted binary hash, after unzip)
  XRAY_VERSION: "v26.10.21"
  XRAY_BIN_PATH: ".cache/xray"
  XRAY_ZIP_SHA256: "0eec3ed4163c273d8c8bf821f7d219e257921cf584aa3fb970715e458e631978"
  # Verified against extracted xray from Xray-linux-64.zip (v26.10.21, 2026-10-21)
  XRAY_BIN_SHA256: "a27e3f95ab6ce270956d0cecd32eda4686a811afc71c64a6a734a3dede14883e"

jobs:
  aggregate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # ── Freshness gate ────────────────────────────────────────────────
      - name: Freshness gate
        id: gate
        run: |
          FORCE="${{ github.event.inputs.force }}"
          EVENT="${{ github.event_name }}"
          if [ "$FORCE" = "true" ] || [ "$EVENT" = "workflow_dispatch" ] || \
             [ "$EVENT" = "push" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch --depth=1 origin "$PUBLISH_BRANCH" 2>/dev/null || true
          if git show FETCH_HEAD:index.json >/tmp/gate_index.json 2>/dev/null && \
             [ -s /tmp/gate_index.json ]; then
            AGE=$(python3 -c "import json,time;d=json.load(open('/tmp/gate_index.json'));print(int(time.time()-d.get('updated_at_unix',0)))" 2>/dev/null || echo "99999")
            GATE_SEC=$((FRESHNESS_GATE_MINUTES * 60))
            if [ "$AGE" -ge "$GATE_SEC" ]; then
              echo "should_run=true" >> "$GITHUB_OUTPUT"
            else
              echo "should_run=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          fi
          echo "Age: ${AGE:-unknown}s, Gate: ${GATE_SEC}s"

      # ── Python setup ──────────────────────────────────────────────────
      - name: Setup Python
        if: steps.gate.outputs.should_run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        if: steps.gate.outputs.should_run == 'true'
        run: python -m pip install --upgrade pip pytest

      # ── Xray-core binary (pinned + SHA-256 verified) ──────────────────
      - name: Download Xray-core
        if: steps.gate.outputs.should_run == 'true'
        env:
          XRAY_URL: "https://github.com/XTLS/Xray-core/releases/download/${{ env.XRAY_VERSION }}/Xray-linux-64.zip"
        run: |
          set -euo pipefail
          # Binary checksum is required — fail if not configured
          if [ -z "${{ env.XRAY_BIN_SHA256 }}" ]; then
            echo "::error::XRAY_BIN_SHA256 is not set; binary integrity verification is disabled"
            exit 1
          fi
          mkdir -p .cache
          ZIP=".cache/Xray-linux-64.zip"
          BIN=".cache/xray"
          if [ ! -f "$BIN" ]; then
            echo "Downloading Xray-core ${{ env.XRAY_VERSION }} ..."
            curl -fsSL --retry 3 --retry-delay 2 --connect-timeout 15 --max-time 120 \
              "$XRAY_URL" -o "$ZIP"
            GOT_ZIP=$(sha256sum "$ZIP" | cut -d' ' -f1)
            if [ "$GOT_ZIP" != "${{ env.XRAY_ZIP_SHA256 }}" ]; then
              echo "::error::Xray-core zip checksum mismatch (tampered or corrupt)"
              echo "  expected ${{ env.XRAY_ZIP_SHA256 }}"
              echo "  actual   $GOT_ZIP"
              rm -f "$ZIP"
              exit 1
            fi
            echo "  zip sha256 verified ✓"
            unzip -q -o "$ZIP" xray -d .cache
            chmod +x "$BIN"
            rm -f "$ZIP"
          else
            echo "Using cached Xray-core binary"
          fi
          # Always verify the extracted binary before use
          GOT_BIN=$(sha256sum "$BIN" | cut -d' ' -f1)
          if [ "$GOT_BIN" != "${{ env.XRAY_BIN_SHA256 }}" ]; then
            echo "::error::Xray-core binary checksum mismatch after extraction"
            echo "  expected ${{ env.XRAY_BIN_SHA256 }}"
            echo "  actual   $GOT_BIN"
            exit 1
          fi
          echo "  binary sha256 verified ✓"
          .cache/xray version

      # ── Tests ─────────────────────────────────────────────────────────
      - name: Run tests
        if: steps.gate.outputs.should_run == 'true'
        run: python -m pytest proxy_aggregator/tests/ -v --tb=short

      # ── Run aggregation ───────────────────────────────────────────────
      - name: Run aggregator
        if: steps.gate.outputs.should_run == 'true'
        env:
          XRAY_BIN: ".cache/xray"
        run: python -m proxy_aggregator.aggregate --out .

      # ── Publish ───────────────────────────────────────────────────────
      - name: Publish outputs
        if: steps.gate.outputs.should_run == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/publish.py --branch "$PUBLISH_BRANCH" --out-mark "$OUT_MARK"
