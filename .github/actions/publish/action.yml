name: Generate and publish subscriptions
description: >-
  Run the production generation once for a given checkout. Evaluates the
  13-minute freshness gate, builds and guards output, verifies the base commit
  is still the current origin/main, and only then records the publication
  timestamp and pushes. If origin/main moved while the pipeline was running,
  nothing is committed and no publication timestamp is recorded; the action
  reports the race so the caller can regenerate from the newest main.

inputs:
  token:
    description: >-
      Token used for the commit/push step (normally the workflow GITHUB_TOKEN
      with contents: write).
    required: true

outputs:
  decision:
    description: Freshness gate decision (RUN or SKIP).
    value: ${{ steps.freshness.outputs.decision }}
  raced:
    description: >-
      "true" when origin/main moved during generation. Empty or "false" means
      the output was published, or the gate decided to skip.
    value: ${{ steps.race.outputs.raced }}

runs:
  using: composite
  steps:
    - name: Create output directory
      shell: bash
      run: mkdir -p output

    # Phase 18 freshness gate. The schedule fires every 5 minutes, but a real
    # publication must not happen more than ~once per 15 minutes. This step
    # compares the last successful publication time (output/published_at.json,
    # committed only by the successful-publish step below) against the
    # 13-minute threshold and exits with Decision SKIP/RUN. Every expensive
    # downstream step is guarded on `decision == 'RUN'`, so a SKIP finishes
    # the job green without running the pipeline or GeoIP provisioning.
    # The concurrency group (`publish`, cancel-in-progress: false) queues any
    # overlapping run, so a later trigger always reads the state committed by
    # an earlier one - the gate can never create a second concurrent
    # publisher, and no cross-run lock is needed.
    #
    # Phase 21: the gate now runs on both the initial attempt and the bounded
    # retry. The retry checks out the current main, so if a publication landed
    # while the first attempt was racing, the retry's gate reads that fresh
    # timestamp and correctly decides SKIP instead of publishing twice inside
    # the 13-minute window.
    - name: Freshness gate
      id: freshness
      shell: bash
      run: |
        set -euo pipefail
        flag=""
        if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
          flag="--force"
        fi
        uv run python -m proxyaggregator freshness-gate $flag

    # GeoIP provisioning. No credentials are involved: the country MMDB from
    # the ip-location-db project (database_type "country ipvAll") is fetched
    # fresh on every run into $PA_GEOIP_DB_PATH (a .runtime/ dir inside the
    # workspace that is never staged/committed). The release asset is the
    # raw MMDB, so no archive extraction is needed.
    - name: Provision GeoIP database
      if: steps.freshness.outputs.decision == 'RUN'
      shell: bash
      run: |
        set -euo pipefail
        db_path="$PA_GEOIP_DB_PATH"
        mkdir -p "$(dirname "$db_path")"
        curl -fsSL --retry 3 --connect-timeout 30 \
          -o "$db_path" \
          "https://github.com/sapics/ip-location-db/releases/download/latest/user-country.mmdb"
        if [ ! -s "$db_path" ]; then
          echo "ERROR: downloaded GeoIP database is empty." >&2
          exit 1
        fi
        echo "GeoIP database provisioned at $db_path"

    # SHA-256 integrity check. GitHub publishes an official `digest` for
    # every release asset (api.github.com .../releases/latest ->
    # assets[].digest); it is fetched at runtime so it always matches the
    # current upstream file — nothing is hard-coded.
    - name: Verify GeoIP database checksum
      if: steps.freshness.outputs.decision == 'RUN'
      shell: bash
      run: |
        set -euo pipefail
        db_path="$PA_GEOIP_DB_PATH"
        test -s "$db_path" || {
          echo "ERROR: GeoIP database missing or empty: $db_path" >&2
          exit 1
        }
        expected="$(curl -fsSL --retry 3 --connect-timeout 30 \
          "https://api.github.com/repos/sapics/ip-location-db/releases/latest" \
          | python3 -c 'import json, sys; data = json.load(sys.stdin); assets = [a for a in data.get("assets", []) if a.get("name") == "user-country.mmdb"]; digest = assets[0].get("digest", "") if assets else ""; print(digest.removeprefix("sha256:") if digest.startswith("sha256:") else "")')"
        if [ -z "$expected" ]; then
          echo "ERROR: upstream SHA-256 digest for user-country.mmdb could not be obtained." >&2
          exit 1
        fi
        actual="$(sha256sum "$db_path" | awk '{print $1}')"
        if [ "$actual" != "$expected" ]; then
          echo "ERROR: SHA-256 verification failed for $db_path" >&2
          echo "expected=$expected" >&2
          echo "actual=$actual" >&2
          exit 1
        fi
        echo "GeoIP database SHA-256 verified ($expected)"

    # Fails fast with a clear error if the provisioned database is missing,
    # unreadable, invalid, or the wrong type. Never prints credentials.
    - name: Verify GeoIP database
      if: steps.freshness.outputs.decision == 'RUN'
      shell: bash
      run: uv run python -m proxyaggregator verify-geoip

    - name: Apply database migrations
      if: steps.freshness.outputs.decision == 'RUN'
      shell: bash
      run: uv run alembic upgrade head

    # Production source seeding (Phase 9.2). The `seed-sources` command loads
    # the repository-controlled config/sources.json definition file into the
    # `sources` table (validated, credential-free, url-keyed upsert). It never
    # fetches; the pipeline below owns all network I/O. Seed *before* the
    # pipeline so the empty-table fast-fail reflects the real definitions.
    - name: Seed production sources
      if: steps.freshness.outputs.decision == 'RUN'
      shell: bash
      run: uv run python -m proxyaggregator seed-sources

    # Full pipeline integration point (Phase 9.1, roadmap item "Full pipeline
    # integration"). The `pipeline` command orchestrates sources -> parse ->
    # dedup -> persist -> geoip -> health -> score -> subscription in
    # docs/PUBLISHER.md's order and fails fast (non-zero) when no sources are
    # configured or no proxy is eligible, so empty/stale feeds are never
    # published. Production sources are registered in the `sources` table by
    # the seed step above; the pipeline never invents sources.
    - name: Run production pipeline
      if: steps.freshness.outputs.decision == 'RUN'
      shell: bash
      run: uv run python -m proxyaggregator pipeline

    - name: Guard against empty or invalid output
      if: steps.freshness.outputs.decision == 'RUN'
      shell: bash
      run: |
        set -euo pipefail
        if [ ! -d output ]; then
          echo "ERROR: output/ missing after pipeline run" >&2
          exit 1
        fi
        # Structural + integrity guard: manifest.json must exist, be valid
        # JSON, list at least one non-empty feed, and every listed artifact
        # must exist with the exact recorded byte_size and SHA-256. Database
        # files are never considered artifacts. A failure here means the
        # release is incomplete or corrupted, so nothing is published.
        uv run python - <<'PY'
        import sys
        from proxyaggregator.publishing.publisher import verify_release
        try:
            verify_release("output")
        except Exception as exc:
            print(f"ERROR: output guard failed: {exc}", file=sys.stderr)
            sys.exit(1)
        PY
        echo "Output guard passed"

    # Phase 21 stale-tree guard. A queued run starts from the commit that
    # triggered it, which can predate a publication that landed while the run
    # was waiting. If origin/main moved while this pipeline was running, the
    # generated output was built from the older tree: the removed files are
    # still present and the added files are missing, so the release on disk is
    # a mixture of two trees. Publishing it would restore deleted output and
    # drop new proxies. Instead the output is discarded here - before
    # record-publish and before the push - and the caller regenerates from the
    # newest main on a fresh runner. There is no rebase and no force push: a
    # regenerated release is pushed as an ordinary fast-forward.
    - name: Verify base commit is still origin/main
      id: race
      if: steps.freshness.outputs.decision == 'RUN'
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.token }}
      run: |
        set -euo pipefail
        base="$(git rev-parse HEAD)"
        git fetch --no-tags --quiet origin main
        head_sha="$(git rev-parse FETCH_HEAD)"
        echo "generated_from=$base"
        echo "origin_main=$head_sha"
        if [ "$base" = "$head_sha" ]; then
          echo "raced=false" >> "$GITHUB_OUTPUT"
          echo "origin/main is still $base: the generated release is based on the current main."
        else
          echo "raced=true" >> "$GITHUB_OUTPUT"
          echo "::warning::origin/main moved from $base to $head_sha while this pipeline was running. The generated release was built from the older tree, so it is discarded and will not be published: nothing is committed and output/published_at.json is not advanced."
        fi

    # Phase 18: record the successful publication. output/published_at.json is
    # written only here - never by the pipeline - so a failed pipeline, a
    # failed output guard, a detected race, or a failed push all leave the
    # previous timestamp untouched and later scheduled runs remain free to
    # retry.
    - name: Record successful publication time
      if: steps.freshness.outputs.decision == 'RUN' && steps.race.outputs.raced == 'false'
      shell: bash
      run: uv run python -m proxyaggregator record-publish

    - name: Commit & push generated subscriptions
      if: steps.freshness.outputs.decision == 'RUN' && steps.race.outputs.raced == 'false'
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.token }}
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add output README.md
        if git diff --cached --quiet; then
          echo "No subscription changes to commit."
          exit 0
        fi
        git commit -m "chore: update generated subscriptions"
        git push
